<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="120/220/420ms, colour + 4% photo zoom only" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px}.lb{font:var(--type-label);letter-spacing:var(--ls-label);color:var(--text-muted);margin-top:6px;display:block;font-size:10px}.grid{display:flex;gap:12px}</style></head><body><style>@keyframes z{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}@keyframes cbg{0%,100%{background:var(--brass-500)}50%{background:var(--brass-600)}}</style>
<div class="grid" style="gap:24px;align-items:center">
<div style="width:150px;height:100px;overflow:hidden"><img src="../assets/photos/gallery-2.png" style="width:100%;height:100%;object-fit:cover;filter:var(--photo-filter);animation:z 2.4s var(--ease-standard) infinite"></div>
<span style="font:var(--type-label);letter-spacing:var(--ls-label);padding:14px 30px;animation:cbg 1.8s var(--ease-standard) infinite">Записаться</span>
<span class="lb" style="margin:0">hover: brass darkens, photo zooms 1.04, links brass<br>press: translateY(1px). No bounce, no slide-ins.</span></div></body></html>
