<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--ink-1000);display:grid;place-items:center}
.mark{text-align:center;color:var(--paper)}
.s1{font-family:var(--font-script);font-size:150px;line-height:.95}
.s2{font-family:var(--font-display);font-size:52px;letter-spacing:.14em;text-transform:uppercase;margin-top:18px}
.strip{width:260px;display:flex;flex-direction:column}.strip>div{flex:1}</style></head>
<body><div class="main"><div class="mark"><div class="s1">Парикмахерская</div><div class="s2">нормального человека</div></div></div>
<div class="strip"><div style="background:var(--brass-300)"></div><div style="background:var(--brass-500)"></div><div style="background:var(--brass-600)"></div><div style="background:var(--brass-700)"></div></div>
</body></html>
