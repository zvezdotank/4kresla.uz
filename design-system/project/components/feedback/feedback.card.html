<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-page);padding:24px;display:block}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:flex;flex-direction:column;gap:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Dialog, Notice, BookingForm, Button } = window.DesignSystem_e7043d;
function Demo(){const [open,setOpen]=React.useState(false);
return <div className="stack">
  <div className="stack" style={{gap:10}}>
    <Notice tone="success">Заявка принята. Перезвоним в течение 15 минут.</Notice>
    <Notice tone="warning">На это время свободен только Тихонов Илья.</Notice>
    <Notice tone="danger">Не удалось отправить заявку. Позвоните нам.</Notice>
  </div>
  <Button onClick={()=>setOpen(true)}>Открыть запись</Button>
  <div style={{position:"relative",height:250,border:"1px solid var(--border-hairline)",overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,background:"var(--overlay-photo-strong)",display:"grid",placeItems:"center"}}>
      <div style={{width:420,background:"var(--surface-card)",borderTop:"3px solid var(--brass-500)",boxShadow:"var(--shadow-raised)",padding:24}}>
        <h3 style={{textAlign:"center",marginBottom:16}}>Записаться онлайн</h3>
        <BookingForm/>
      </div>
    </div>
  </div>
  {open&&<Dialog title="Записаться онлайн" onClose={()=>setOpen(false)}><BookingForm onSubmit={()=>setOpen(false)}/></Dialog>}
</div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body></html>
